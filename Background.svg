<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="100%" height="100%">
  <defs>
    <!-- 上半部渐变：蓝 -> 紫 -->
    <linearGradient id="upper-gradient" x1="343" y1="333" x2="961" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0785FF"/>
      <stop offset="0.24" stop-color="#316FF8"/>
      <stop offset="0.50" stop-color="#6254F5"/>
      <stop offset="0.76" stop-color="#9143ED"/>
      <stop offset="1" stop-color="#C23BE0"/>
    </linearGradient>

    <!-- 下半部渐变：绿 -> 黄 -> 橙 -> 粉红 -->
    <linearGradient id="lower-gradient" x1="378" y1="850" x2="866" y2="425" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12C7A4"/>
      <stop offset="0.21" stop-color="#91C83F"/>
      <stop offset="0.39" stop-color="#F0B52F"/>
      <stop offset="0.61" stop-color="#F28A32"/>
      <stop offset="0.82" stop-color="#F06450"/>
      <stop offset="1" stop-color="#E34C72"/>
    </linearGradient>

    <!-- FUFOOO Ribbon F 图标完整矢量路径 -->
    <g id="fufooo-mark" shape-rendering="geometricPrecision">
      <path id="upper-ribbon" fill="url(#upper-gradient)" d="
        M 509 182 H 937 C 952 182 961 192 961 208
        C 960 241 944 273 920 296 C 897 318 866 333 835 333
        H 509 C 461 333 420 351 390 382 C 368 405 351 439 343 482
        V 341 C 343 253 417 182 509 182 Z"/>
      <path id="lower-ribbon" fill="url(#lower-gradient)" d="
        M 515 417 H 874 C 884 417 890 424 889 435
        C 885 469 869 501 843 524 C 820 545 788 558 754 558
        H 561 C 527 558 499 586 499 621 V 747
        C 499 811 452 864 389 874 C 374 877 365 870 365 855
        L 360 584 C 360 492 429 417 515 417 Z"/>
    </g>

    <!-- 背景基底渐变：暗夜深空蓝黑 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14" />
      <stop offset="45%" stop-color="#0E1222" />
      <stop offset="100%" stop-color="#080B16" />
    </linearGradient>

    <!-- 蓝紫霓虹光晕 -->
    <radialGradient id="neon-glow-upper" cx="75%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#6254F5" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#C23BE0" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070A14" stop-opacity="0" />
    </radialGradient>

    <!-- 青绿/橙霓虹光晕 -->
    <radialGradient id="neon-glow-lower" cx="30%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#12C7A4" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#F28A32" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070A14" stop-opacity="0" />
    </radialGradient>

    <!-- 顶部主标题字渐变 -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#EAEFFF" />
      <stop offset="100%" stop-color="#9143ED" />
    </linearGradient>

    <!-- 顶线彩虹渐变 -->
    <linearGradient id="rainbow-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0785FF" />
      <stop offset="35%" stop-color="#6254F5" />
      <stop offset="70%" stop-color="#12C7A4" />
      <stop offset="100%" stop-color="#F28A32" />
    </linearGradient>

    <!-- 发光投影 -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#6254F5" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="1500" height="500" fill="url(#bg-grad)" />
  <rect width="1500" height="500" fill="url(#neon-glow-upper)" />
  <rect width="1500" height="500" fill="url(#neon-glow-lower)" />

  <!-- 2. 数字科技微网格 -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="100" x2="1500" y2="100" />
    <line x1="0" y1="200" x2="1500" y2="200" />
    <line x1="0" y1="300" x2="1500" y2="300" />
    <line x1="0" y1="400" x2="1500" y2="400" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
    <line x1="1000" y1="0" x2="1000" y2="500" />
    <line x1="1250" y1="0" x2="1250" y2="500" />
  </g>

  <!-- 3. 右侧背景超大水印 -->
  <g transform="translate(1020, -90) scale(0.95)" opacity="0.18">
    <use href="#fufooo-mark" />
  </g>

  <!-- 4. 主要信息区域 (避开左侧头像区) -->
  <g transform="translate(460, 0)">
    <!-- 品牌标志组合 -->
    <g transform="translate(20, 85)">
      <g transform="scale(0.12) translate(-343, -182)">
        <use href="#fufooo-mark" />
      </g>
      <text x="88" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="5" fill="#FFFFFF">FUFOOO</text>
      <text x="330" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#12C7A4">OFFICIAL</text>
    </g>

    <!-- 宣传大标题 -->
    <g filter="url(#text-glow)">
      <text x="20" y="225" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="900" letter-spacing="4" fill="url(#title-grad)">专业游戏与数字服务</text>
    </g>

    <!-- 副标题 -->
    <text x="22" y="285" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="22" font-weight="500" letter-spacing="1.5" fill="#A4B3D6">一站式解决方案 · 安全可靠 · 自动化快捷交付</text>

    <!-- 特性标签组 -->
    <g transform="translate(22, 335)">
      <!-- 极速充值 -->
      <g>
        <rect width="185" height="46" rx="23" fill="#12182B" stroke="#316FF8" stroke-width="1.6" />
        <text x="92" y="30" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#7AA2F7" text-anchor="middle">⚡ 极速充值</text>
      </g>

      <!-- 官方合规 -->
      <g transform="translate(210, 0)">
        <rect width="185" height="46" rx="23" fill="#12182B" stroke="#12C7A4" stroke-width="1.6" />
        <text x="92" y="30" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#20E1BD" text-anchor="middle">🛡️ 官方合规</text>
      </g>

      <!-- 24/7 自动交付 -->
      <g transform="translate(420, 0)">
        <rect width="185" height="46" rx="23" fill="#12182B" stroke="#F28A32" stroke-width="1.6" />
        <text x="92" y="30" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#FFA966" text-anchor="middle">🌐 24/7 自动交付</text>
      </g>
    </g>
  </g>

  <!-- 5. 顶部分割炫光线 -->
  <line x1="0" y1="2" x2="1500" y2="2" stroke="url(#rainbow-border)" stroke-width="3" opacity="0.8" />
</svg>

