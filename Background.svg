<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="100%" height="100%">
  <defs>
    <!-- 上半部 Ribbon 渐变：蓝 -> 紫 -->
    <linearGradient id="upper-gradient" x1="343" y1="333" x2="961" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0785FF"/>
      <stop offset="0.24" stop-color="#316FF8"/>
      <stop offset="0.50" stop-color="#6254F5"/>
      <stop offset="0.76" stop-color="#9143ED"/>
      <stop offset="1" stop-color="#C23BE0"/>
    </linearGradient>

    <!-- 下半部 Ribbon 渐变：绿 -> 橙 -> 桃红 -->
    <linearGradient id="lower-gradient" x1="378" y1="850" x2="866" y2="425" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12C7A4"/>
      <stop offset="0.21" stop-color="#91C83F"/>
      <stop offset="0.39" stop-color="#F0B52F"/>
      <stop offset="0.61" stop-color="#F28A32"/>
      <stop offset="0.82" stop-color="#F06450"/>
      <stop offset="1" stop-color="#E34C72"/>
    </linearGradient>

    <!-- Ribbon F 原始标 -->
    <g id="mark" shape-rendering="geometricPrecision">
      <path id="upper-ribbon" fill="url(#upper-gradient)" d="
        M 509 182 H 937 C 952 182 961 192 961 208
        C 960 241 944 273 920 296 C 897 318 866 333 835 333
        H 509 C 461 333 420 351 390 382 C 368 405 351 439 343 482
        V 341 C 343 253 417 182 509 182 Z"/>
      <path id="lower-ribbon" fill="url(#lower-gradient)" d="
        M 515 417 H 874 C 884 417 890 424 889 435
        C 885 469 869 501 843 524 C 820 545 788 558 754 558
        H 561 C 527 558 499 586 499 621 V 747
        C 499 811 452 864 389 874 C 374 877 365 870 365 855
        L 360 584 C 360 492 429 417 515 417 Z"/>
    </g>

    <!-- 字母 o 原型 -->
    <path id="master-o" d="M50 22 C75 22 92 40 92 68 C92 96 75 114 50 114 C25 114 8 96 8 68 C8 40 25 22 50 22 Z"/>

    <!-- 官方标准组合标 (放大比例至原本尺寸直接调用) -->
    <g id="fufooo-full-logo">
      <g transform="translate(8 8) scale(0.18) translate(-343 -182)">
        <use href="#mark"/>
      </g>
      <g transform="translate(128 8)" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" shape-rendering="geometricPrecision">
        <path d="M18 48 V72 C18 98 32 114 53 114 C74 114 88 98 88 72 V31"/>
        <path d="M151 114 V45 C151 20 165 8 188 8 C198 8 206 11 213 16 M126 53 C148 49 172 49 198 52"/>
        <use href="#master-o" transform="translate(218 0)"/>
        <use href="#master-o" transform="translate(326 0)"/>
        <use href="#master-o" transform="translate(434 0)"/>
      </g>
    </g>

    <!-- 背景基底渐变：深邃科技暗底 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B16" />
      <stop offset="50%" stop-color="#0F1528" />
      <stop offset="100%" stop-color="#090C18" />
    </linearGradient>

    <!-- 霓虹主光晕 -->
    <radialGradient id="neon-glow" cx="68%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6254F5" stop-opacity="0.36" />
      <stop offset="45%" stop-color="#C23BE0" stop-opacity="0.12" />
      <stop offset="85%" stop-color="#12C7A4" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#080B16" stop-opacity="0" />
    </radialGradient>

    <!-- 主标题字样高亮渐变 -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F5F8FF" />
      <stop offset="100%" stop-color="#D7E0FF" />
    </linearGradient>

    <!-- 顶部全彩标线条 -->
    <linearGradient id="rainbow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0785FF" />
      <stop offset="25%" stop-color="#6254F5" />
      <stop offset="50%" stop-color="#C23BE0" />
      <stop offset="75%" stop-color="#12C7A4" />
      <stop offset="100%" stop-color="#F28A32" />
    </linearGradient>

    <!-- 统一发光投影 -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. 背景层 -->
  <rect width="1500" height="500" fill="url(#bg-grad)" />
  <rect width="1500" height="500" fill="url(#neon-glow)" />

  <!-- 2. 背景网格装饰 -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1.2">
    <line x1="0" y1="125" x2="1500" y2="125" />
    <line x1="0" y1="250" x2="1500" y2="250" />
    <line x1="0" y1="375" x2="1500" y2="375" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="900" y1="0" x2="900" y2="500" />
    <line x1="1200" y1="0" x2="1200" y2="500" />
  </g>

  <!-- 3. 右侧背景：巨大水印，与左侧头像达成对角平衡 -->
  <g transform="translate(1000, -70) scale(1.05)" opacity="0.14">
    <use href="#mark" />
  </g>

  <!-- 4. 居中偏右核心内容区（从 x=430 开始，安全避开左侧头像，电脑大屏视觉饱满） -->
  <g transform="translate(430, 0)" filter="url(#soft-shadow)">
    
    <!-- 品牌 Wordmark (scale 0.95，宽度达 640px，清晰显眼) -->
    <g transform="translate(0, 50) scale(0.95)">
      <use href="#fufooo-full-logo" />
    </g>

    <!-- 主标题：字号加大到 68px，粗体醒目 -->
    <text x="5" y="248" 
          font-family="system-ui, -apple-system, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#title-grad)">
      专业游戏与数字服务
    </text>

    <!-- 副标题：字号加大到 28px，字间距拉开 -->
    <text x="8" y="318" 
          font-family="system-ui, -apple-system, 'PingFang SC', 'Segoe UI', sans-serif" 
          font-size="28" 
          font-weight="600" 
          letter-spacing="2" 
          fill="#B0C1E8">
      一站式解决方案 · 安全可靠 · 自动化快捷交付
    </text>

    <!-- 特性标签组：统一放大 (高56px，字号21px)，比例饱满协调 -->
    <g transform="translate(8, 368)">
      <!-- 极速充值 -->
      <g>
        <rect width="230" height="56" rx="28" fill="#131B32" stroke="#316FF8" stroke-width="2" />
        <text x="115" y="36" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#8BB2FF" text-anchor="middle">⚡ 极速充值</text>
      </g>

      <!-- 官方合规 -->
      <g transform="translate(260, 0)">
        <rect width="230" height="56" rx="28" fill="#131B32" stroke="#12C7A4" stroke-width="2" />
        <text x="115" y="36" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#2CE8C2" text-anchor="middle">🛡️ 官方合规</text>
      </g>

      <!-- 自动交付 -->
      <g transform="translate(520, 0)">
        <rect width="250" height="56" rx="28" fill="#131B32" stroke="#F28A32" stroke-width="2" />
        <text x="125" y="36" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#FFB070" text-anchor="middle">🌐 24/7 自动交付</text>
      </g>
    </g>
  </g>

  <!-- 5. 顶部边缘炫彩光条 -->
  <line x1="0" y1="2" x2="1500" y2="2" stroke="url(#rainbow-line)" stroke-width="4" opacity="0.9" />
</svg>

